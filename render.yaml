# Render.com static site specification
services:
  - type: static
    name: omni-view-command-centre
    buildCommand: python3 parse_llms_txt.py --generate-all
    staticPublishPath: ./
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=3600
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.datatables.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.datatables.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:;"
