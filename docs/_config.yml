title: Omni View Business Command Centre
description: Executive Business Dashboard & Operational Analytics Engine
baseurl: "/For-Review-Omni-View-Business-Command-Centre"
url: "https://linuxmalaysia.github.io"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

highlighter: rouge
theme: null

permalink: pretty

include:
  - README.md
  - CHANGELOG.md
  - HISTORY.md
  - SUMMARY.md
