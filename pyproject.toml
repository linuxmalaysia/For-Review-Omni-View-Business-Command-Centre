[project]
name = "omni-view"
version = "0.1.0"
description = "Omni-View Business Command Centre - Integrated Operations Management System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.7.0",
    "playwright>=1.40.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
