name: Documentation CI & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-verify-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Pinned uv with Checksum Verification
        run: |
          UV_VERSION="0.6.3"
          UV_SHA256="b7a37a33d62cb7672716c695226450231e8c02a8eb2b468fa61cd28a8f86eab2"

          curl -sSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz" -o uv.tar.gz
          echo "${UV_SHA256}  uv.tar.gz" | sha256sum -c -

          tar -xzf uv.tar.gz
          mkdir -p ~/.local/bin
          mv uv-x86_64-unknown-linux-gnu/uv ~/.local/bin/
          mv uv-x86_64-unknown-linux-gnu/uvx ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: uv sync

      - name: Verify LLM Index & XML Context Generation
        run: python3 parse_llms_txt.py --generate-all

      - name: Verify Generated Index Artifacts Match Committed Versions
        run: |
          git diff --exit-code llm_context.xml llms.txt llms-full.txt sitemap.txt sitemap.xml docs/llms.txt docs/llms-full.txt docs/sitemap.txt docs/sitemap.xml

      - name: Security Audit Python Dependencies
        run: uv audit

      - name: Code Health & Linting (Ruff)
        run: uv run ruff check .

      - name: Markdown Linting (markdownlint-cli)
        run: npx markdownlint-cli -c .markdownlint.json "**/*.md"

      - name: Run Test Suite (pytest)
        run: uv run pytest
